<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Ledger | VP MICROFINANCE PRO 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Libraries for Excel & PDF Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

    <style>
        body { font-family: 'Poppins', sans-serif; background: #0b0f19; color: #e2e8f0; }
        .yono-gradient { background: linear-gradient(135deg, #6b21a8 0%, #1e40af 100%); }
        .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
    </style>
</head>
<body class="min-h-screen bg-[#060814] text-slate-100 flex">

    <aside id="sidebar" class="w-64 glass-card fixed inset-y-0 left-0 z-50 p-4 m-3 rounded-2xl h-[calc(100vh-24px)] transition-transform duration-300 lg:translate-x-0 -translate-x-full lg:static">
        <div class="flex items-center gap-3 px-2 py-4 border-b border-white/5 mb-6">
            <div class="w-8 h-8 rounded-lg yono-gradient flex items-center justify-center text-white font-bold text-sm shadow-md">VP</div>
            <div>
                <h1 class="text-xs font-bold tracking-wider text-white uppercase">VP Microfinance</h1>
                <p class="text-[10px] text-purple-400 font-medium tracking-wide">Pro 2026 Registry</p>
            </div>
        </div>
        <nav class="space-y-1">
            <a href="index.html" class="flex items-center gap-3 px-3 py-2.5 text-slate-400 hover:text-white hover:bg-white/5 rounded-xl text-xs font-medium transition-all group">
                <i class="fa-solid fa-chart-pie group-hover:text-purple-400"></i> Dashboard Matrix
            </a>
            <a href="customer-add.html" class="flex items-center gap-3 px-3 py-2.5 text-slate-400 hover:text-white hover:bg-white/5 rounded-xl text-xs font-medium transition-all group">
                <i class="fa-solid fa-user-plus group-hover:text-purple-400"></i> Capital Disbursement
            </a>
            <a href="customer-list.html" class="flex items-center gap-3 px-3 py-2.5 text-white yono-gradient rounded-xl text-xs font-medium shadow-lg transition-all">
                <i class="fa-solid fa-address-book"></i> Customer Ledger
            </a>
        </nav>
    </aside>

    <main class="flex-1 lg:pl-6 p-6 overflow-x-hidden">
        <header class="flex flex-wrap items-center justify-between gap-4 mb-6 pb-4 border-b border-white/5">
            <div class="flex items-center gap-3">
                <button onclick="toggleSidebarLayout()" class="lg:hidden p-2 text-slate-400 hover:text-white glass-card rounded-xl text-xs"><i class="fa-solid fa-bars"></i></button>
                <div>
                    <h2 class="text-base font-semibold text-white tracking-wide">VPM_ Customer List</h2>
                    <p class="text-xs text-slate-400">Enterprise operational data cache pipelines.</p>
                </div>
            </div>
            
            <div class="flex items-center gap-2">
                <!-- Export Buttons -->
                <button onclick="exportToExcel()" class="px-3 py-2 bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-300 border border-emerald-500/30 rounded-xl text-xs font-medium transition-all flex items-center gap-1.5">
                    <i class="fa-solid fa-file-excel"></i> Excel
                </button>
                <button onclick="exportToPDF()" class="px-3 py-2 bg-rose-600/20 hover:bg-rose-600/30 text-rose-300 border border-rose-500/30 rounded-xl text-xs font-medium transition-all flex items-center gap-1.5">
                    <i class="fa-solid fa-file-pdf"></i> PDF
                </button>
                <button onclick="window.location.href='customer-add.html'" class="px-4 py-2 yono-gradient text-white rounded-xl text-xs font-medium hover:opacity-90 shadow-md flex items-center gap-2">
                    <i class="fa-solid fa-plus text-[10px]"></i> Onboard Account
                </button>
            </div>
        </header>

        <div class="glass-card rounded-2xl border border-white/5 overflow-hidden shadow-2xl">
            <div class="overflow-x-auto w-full">
                <table class="w-full text-left border-collapse whitespace-nowrap">
                    <thead>
                        <tr class="bg-white/[0.02] border-b border-white/5 text-[10px] tracking-wider text-slate-400 font-semibold uppercase">
                            <th class="px-6 py-4">Account No</th>
                            <th class="px-6 py-4">Customer Name</th>
                            <th class="px-6 py-4">Address / Landmark</th>
                            <th class="px-6 py-4">EMI / Outstanding</th>
                            <th class="px-6 py-4">KYC Proofs</th>
                            <th class="px-6 py-4">Approval Status</th>
                            <th class="px-6 py-4 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="customerTableBody" class="divide-y divide-white/5 text-xs text-slate-300">
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Modal for Dynamic Action View/Edit -->
    <div id="actionModal" class="fixed inset-0 bg-black/70 backdrop-blur-md flex items-center justify-center z-50 p-4 hidden">
        <div class="glass-card w-full max-w-lg rounded-2xl p-6 border border-white/10 shadow-2xl relative max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between border-b border-white/5 pb-3 mb-4">
                <h3 id="modalTitle" class="text-xs font-bold tracking-wider uppercase text-purple-400">Registry Workspace</h3>
                <button onclick="closeActionModal()" class="text-slate-400 hover:text-white text-sm transition-all"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <form id="modalForm" onsubmit="saveUpdatedCustomerData(event)" class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[10px] text-slate-400 mb-1 uppercase">Account Number</label>
                        <input type="text" id="modalAccountNo" readonly class="w-full px-3 py-2 bg-white/5 border border-slate-700/60 rounded-xl text-purple-300 font-mono font-bold text-xs focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-[10px] text-slate-400 mb-1 uppercase">Customer Name</label>
                        <input type="text" id="modalName" required class="w-full px-3 py-2 bg-white/5 border border-slate-700/60 rounded-xl text-white text-xs focus:outline-none focus:border-purple-500">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[10px] text-slate-400 mb-1 uppercase">Mobile Number</label>
                        <input type="tel" id="modalMobile" required class="w-full px-3 py-2 bg-white/5 border border-slate-700/60 rounded-xl text-white text-xs focus:outline-none focus:border-purple-500">
                    </div>
                    <div>
                        <label class="block text-[10px] text-slate-400 mb-1 uppercase">Disbursed Principal (₹)</label>
                        <input type="number" id="modalPrincipal" required class="w-full px-3 py-2 bg-white/5 border border-slate-700/60 rounded-xl text-white text-xs focus:outline-none focus:border-purple-500">
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] text-slate-400 mb-1 uppercase">Address</label>
                    <textarea id="modalAddress" rows="2" class="w-full px-3 py-2 bg-white/5 border border-slate-700/60 rounded-xl text-white text-xs focus:outline-none focus:border-purple-500 resize-none"></textarea>
                </div>

                <div>
                    <label class="block text-[10px] text-slate-400 mb-1 uppercase">Landmark</label>
                    <input type="text" id="modalLandmark" class="w-full px-3 py-2 bg-white/5 border border-slate-700/60 rounded-xl text-white text-xs focus:outline-none focus:border-purple-500">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[10px] text-slate-400 mb-1 uppercase">Installment EMI (₹)</label>
                        <input type="number" id="modalEMI" required class="w-full px-3 py-2 bg-white/5 border border-slate-700/60 rounded-xl text-emerald-400 font-mono font-bold text-xs focus:outline-none focus:border-purple-500">
                    </div>
                    <div>
                        <label class="block text-[10px] text-slate-400 mb-1 uppercase">Approval Status</label>
                        <select id="modalStatus" class="w-full px-3 py-2 bg-slate-900 border border-slate-700/60 rounded-xl text-xs text-white focus:outline-none focus:border-purple-500">
                            <option value="LOAN APPROVED">LOAN APPROVED</option>
                            <option value="LOAN REJECTED">LOAN REJECTED</option>
                            <option value="LOAN AMOUNT CHANGE">LOAN AMOUNT CHANGE</option>
                        </select>
                    </div>
                </div>

                <div id="modalActionButtons" class="flex justify-end gap-3 border-t border-white/5 pt-4 mt-6">
                    <button type="button" onclick="closeActionModal()" class="px-4 py-2 bg-white/5 hover:bg-white/10 text-slate-300 rounded-xl text-xs font-medium transition-all">Dismiss View</button>
                    <button type="submit" id="modalSubmitBtn" class="px-5 py-2 yono-gradient text-white rounded-xl text-xs font-medium shadow-md hover:opacity-90 transition-all">Synchronize Parameters</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Image View Lightbox Modal -->
    <div id="imageModal" class="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center z-50 p-4 hidden">
        <div class="glass-card max-w-2xl w-full p-4 rounded-2xl relative text-center">
            <div class="flex items-center justify-between pb-3 mb-2 border-b border-white/10">
                <h4 id="imageModalTitle" class="text-xs font-bold text-purple-300 uppercase">Document View</h4>
                <button onclick="document.getElementById('imageModal').classList.add('hidden')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="max-h-[75vh] overflow-auto flex items-center justify-center">
                <img id="previewImage" src="" alt="Proof Preview" class="max-w-full max-h-[70vh] rounded-lg object-contain border border-white/10 shadow-xl">
            </div>
        </div>
    </div>

    <script>
        const CLOUD_SYNC_URL = "https://script.google.com/macros/s/AKfycby9Fwl090NE0lUuVmrgiXvFv_V7UGfg4nD9ZezIhabsuEMwS-8QvjE5lkXxQtD3FSZO/exec";

        function toggleSidebarLayout() {
            document.getElementById('sidebar').classList.toggle('-translate-x-full');
        }

        // 1. Dynamic Ledger Renderer
        function renderActiveLedgerGrid() {
            const tableBody = document.getElementById('customerTableBody');
            if (!tableBody) return;

            let customers = JSON.parse(localStorage.getItem('vp_local_customers')) || [];
            tableBody.innerHTML = '';

            if (customers.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="7" class="text-center py-12 text-slate-500 text-xs font-medium"><i class="fa-solid fa-folder-open block text-lg mb-2 text-slate-600"></i> No accounts registered inside local dataset matrix bounds.</td></tr>`;
                return;
            }

            customers.forEach((user) => {
                const cleanEmi = parseFloat(user.emi) || 0;
                const cleanOutstanding = parseFloat(user.totalOutstanding) || 0;
                const currentStatus = user.status || 'LOAN APPROVED';

                tableBody.innerHTML += `
                    <tr class="border-b border-white/5 hover:bg-white/[0.01] transition-colors">
                        <td class="px-6 py-4 font-mono font-bold text-purple-400">${user.accountNo || 'VP-N/A'}</td>
                        <td class="px-6 py-4 text-white font-medium">
                            ${user.customerName || 'Unknown'}
                            <span class="block text-[10px] text-slate-400 font-mono">${user.mobile || ''}</span>
                        </td>
                        <td class="px-6 py-4 text-slate-300 text-[11px]">
                            <div class="truncate max-w-[160px]" title="${user.address || 'N/A'}">${user.address || 'N/A'}</div>
                            <span class="text-[10px] text-purple-400 block">${user.landmark ? 'Near: ' + user.landmark : ''}</span>
                        </td>
                        <td class="px-6 py-4 font-mono">
                            <div class="text-emerald-400 font-semibold">EMI: ₹${cleanEmi.toLocaleString('en-IN', {minimumFractionDigits: 2})}</div>
                            <div class="text-amber-400 text-[10px]">Total: ₹${cleanOutstanding.toLocaleString('en-IN', {minimumFractionDigits: 2})}</div>
                        </td>
                        <td class="px-6 py-4">
                            <div class="flex items-center gap-1.5">
                                <button onclick="viewDoc('${user.accountNo}', 'imgAadhar')" class="px-2 py-1 bg-white/5 hover:bg-purple-600/20 text-[10px] text-purple-300 rounded-lg border border-white/10" title="View Aadhar"><i class="fa-solid fa-id-card"></i> Aadhar</button>
                                <button onclick="viewDoc('${user.accountNo}', 'imgPan')" class="px-2 py-1 bg-white/5 hover:bg-purple-600/20 text-[10px] text-blue-300 rounded-lg border border-white/10" title="View PAN"><i class="fa-solid fa-credit-card"></i> PAN</button>
                            </div>
                        </td>
                        <td class="px-6 py-4">
                            <select onchange="handleStatusChange('${user.accountNo}', this.value)" class="px-2.5 py-1 text-[11px] rounded-xl bg-slate-900 border border-slate-700/60 font-semibold focus:outline-none ${getStatusColorClass(currentStatus)}">
                                <option value="LOAN APPROVED" ${currentStatus === 'LOAN APPROVED' ? 'selected' : ''}>LOAN APPROVED</option>
                                <option value="LOAN REJECTED" ${currentStatus === 'LOAN REJECTED' ? 'selected' : ''}>LOAN REJECTED</option>
                                <option value="LOAN AMOUNT CHANGE" ${currentStatus === 'LOAN AMOUNT CHANGE' ? 'selected' : ''}>LOAN AMOUNT CHANGE</option>
                            </select>
                        </td>
                        <td class="px-6 py-4 text-right">
                            <div class="flex items-center justify-end gap-2">
                                <button onclick="viewProfile('${user.accountNo}')" class="w-7 h-7 flex items-center justify-center bg-white/5 text-slate-300 rounded-lg hover:text-white hover:bg-purple-600/20 transition-all" title="View Profile"><i class="fa-solid fa-eye text-[11px]"></i></button>
                                <button onclick="editProfile('${user.accountNo}')" class="w-7 h-7 flex items-center justify-center bg-white/5 text-slate-300 rounded-lg hover:text-white hover:bg-amber-600/20 transition-all" title="Edit Properties"><i class="fa-solid fa-pen-to-square text-[11px]"></i></button>
                                <button onclick="deleteCustomerProfile('${user.accountNo}')" class="w-7 h-7 flex items-center justify-center bg-white/5 text-rose-400 rounded-lg hover:text-white hover:bg-rose-600/20 transition-all" title="Delete Profile"><i class="fa-solid fa-trash-can text-[11px]"></i></button>
                            </div>
                        </td>
                    </tr>
                `;
            });
        }

        function getStatusColorClass(status) {
            if (status === 'LOAN APPROVED') return 'text-emerald-400 border-emerald-500/20';
            if (status === 'LOAN REJECTED') return 'text-rose-400 border-rose-500/20';
            return 'text-amber-400 border-amber-500/20';
        }

        // 2. Status Select Handler (Only redirects IF LOAN APPROVED is selected)
        function handleStatusChange(accountNo, selectedStatus) {
            let customers = JSON.parse(localStorage.getItem('vp_local_customers')) || [];
            let targetIdx = customers.findIndex(c => c.accountNo === accountNo);

            if (targetIdx !== -1) {
                customers[targetIdx].status = selectedStatus;
                localStorage.setItem('vp_local_customers', JSON.stringify(customers));

                // Background Cloud Sync
                const syncEndpoint = `${CLOUD_SYNC_URL}?jsonData=${encodeURIComponent(JSON.stringify({ 
                    action: 'updateStatus', 
                    accountNo: accountNo, 
                    status: selectedStatus 
                }))}`;
                fetch(syncEndpoint, { method: 'GET', mode: 'cors' }).catch(err => console.warn("Cloud sync bypass:", err));

                // Strict Check: Only redirect if LOAN APPROVED
                if (selectedStatus === 'LOAN APPROVED') {
                    alert(`✅ Status changed to LOAN APPROVED for ${accountNo}. Redirecting to Transaction Console...`);
                    window.location.href = `transaction.html?accountNo=${accountNo}`;
                } else {
                    // LOAN REJECTED or LOAN AMOUNT CHANGE keeps user on current page
                    renderActiveLedgerGrid();
                }
            }
        }

        // 3. Document View Lightbox Handler
        function viewDoc(accountNo, docType) {
            let customers = JSON.parse(localStorage.getItem('vp_local_customers')) || [];
            let target = customers.find(c => c.accountNo === accountNo);

            if (target && target[docType]) {
                document.getElementById('previewImage').src = target[docType];
                document.getElementById('imageModalTitle').innerText = `${docType === 'imgAadhar' ? 'Aadhar' : 'PAN'} Card Proof - ${accountNo}`;
                document.getElementById('imageModal').classList.remove('hidden');
            } else {
                alert("⚠️ Document image not uploaded or unavailable for this customer!");
            }
        }

        // 4. View / Edit Profile Modal Logic
        function editProfile(accountNo) {
            let customers = JSON.parse(localStorage.getItem('vp_local_customers')) || [];
            let target = customers.find(c => c.accountNo === accountNo);
            if (!target) return;

            document.getElementById('modalAccountNo').value = target.accountNo || '';
            document.getElementById('modalName').value = target.customerName || '';
            document.getElementById('modalMobile').value = target.mobile || '';
            document.getElementById('modalPrincipal').value = target.principal || 0;
            document.getElementById('modalAddress').value = target.address || '';
            document.getElementById('modalLandmark').value = target.landmark || '';
            document.getElementById('modalEMI').value = target.emi || 0;
            document.getElementById('modalStatus').value = target.status || 'LOAN APPROVED';

            // Show Save Controls
            document.getElementById('modalTitle').innerText = "Edit Customer Profile";
            document.getElementById('modalForm').querySelectorAll('input, textarea, select').forEach(el => el.disabled = false);
            document.getElementById('modalAccountNo').disabled = true; // Read-only account no
            document.getElementById('modalSubmitBtn').classList.remove('hidden');

            document.getElementById('actionModal').classList.remove('hidden');
        }

        function viewProfile(accountNo) {
            editProfile(accountNo);
            // Convert modal into Read-Only View Mode
            document.getElementById('modalTitle').innerText = "Customer Profile Details (View Only)";
            document.getElementById('modalForm').querySelectorAll('input, textarea, select').forEach(el => el.disabled = true);
            document.getElementById('modalSubmitBtn').classList.add('hidden');
        }

        function closeActionModal() {
            document.getElementById('actionModal').classList.add('hidden');
        }

        // 5. Update Pipeline & Modal Save Action
        function saveUpdatedCustomerData(e) {
            e.preventDefault();
            let targetAc = document.getElementById('modalAccountNo').value;
            let customers = JSON.parse(localStorage.getItem('vp_local_customers')) || [];
            let targetIdx = customers.findIndex(c => c.accountNo === targetAc);
            if (targetIdx === -1) return;

            // Update memory payload
            customers[targetIdx].customerName = document.getElementById('modalName').value;
            customers[targetIdx].mobile = document.getElementById('modalMobile').value;
            customers[targetIdx].principal = parseFloat(document.getElementById('modalPrincipal').value) || 0;
            customers[targetIdx].address = document.getElementById('modalAddress').value;
            customers[targetIdx].landmark = document.getElementById('modalLandmark').value;
            customers[targetIdx].emi = parseFloat(document.getElementById('modalEMI').value) || 0;
            
            const selectedStatus = document.getElementById('modalStatus').value;
            customers[targetIdx].status = selectedStatus;

            // Save to LocalStorage
            localStorage.setItem('vp_local_customers', JSON.stringify(customers));
            
            // Cloud Sync Handshake
            const syncEndpoint = `${CLOUD_SYNC_URL}?jsonData=${encodeURIComponent(JSON.stringify({ 
                action: 'updateCustomer', 
                data: customers[targetIdx] 
            }))}`;
            fetch(syncEndpoint, { method: 'GET', mode: 'cors' }).catch(err => console.warn("Cloud sync bypass:", err));

            closeActionModal();
            renderActiveLedgerGrid();

            // Strict Condition: Redirect ONLY on LOAN APPROVED
            if (selectedStatus === 'LOAN APPROVED') {
                window.location.href = `transaction.html?accountNo=${targetAc}`;
            } else {
                alert(`👍 Status updated to "${selectedStatus}" successfully!`);
            }
        }

        // 6. Delete Profile Action
        function deleteCustomerProfile(accountNo) {
            if (confirm(`Are you sure you want to delete customer ${accountNo}?`)) {
                let customers = JSON.parse(localStorage.getItem('vp_local_customers')) || [];
                customers = customers.filter(c => c.accountNo !== accountNo);
                localStorage.setItem('vp_local_customers', JSON.stringify(customers));

                // Cloud Delete Handshake
                const syncEndpoint = `${CLOUD_SYNC_URL}?jsonData=${encodeURIComponent(JSON.stringify({ 
                    action: 'deleteCustomer', 
                    accountNo: accountNo 
                }))}`;
                fetch(syncEndpoint, { method: 'GET', mode: 'cors' }).catch(err => console.warn("Cloud sync bypass:", err));

                renderActiveLedgerGrid();
            }
        }

        // 7. Excel Export Protocol
        function exportToExcel() {
            let customers = JSON.parse(localStorage.getItem('vp_local_customers')) || [];
            if(customers.length === 0) { alert("No data to export!"); return; }

            const worksheet = XLSX.utils.json_to_sheet(customers);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Customers");
            XLSX.writeFile(workbook, "VP_Microfinance_Customer_Ledger.xlsx");
        }

        // 8. Download PDF Protocol
        function exportToPDF() {
            let customers = JSON.parse(localStorage.getItem('vp_local_customers')) || [];
            if(customers.length === 0) { alert("No data to export!"); return; }

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('landscape');

            doc.text("VP MICROFINANCE PRO 2026 - CUSTOMER LEDGER", 14, 15);

            let tableRows = customers.map(c => [
                c.accountNo,
                c.customerName,
                c.mobile,
                c.address || '',
                `Rs. ${c.principal}`,
                `Rs. ${c.emi}`,
                c.status || 'LOAN APPROVED'
            ]);

            doc.autoTable({
                head: [['Account No', 'Name', 'Mobile', 'Address', 'Principal', 'EMI', 'Status']],
                body: tableRows,
                startY: 20,
                theme: 'grid',
                headStyles: { fillColor: [107, 33, 168] }
            });

            doc.save("VP_Microfinance_Customer_Ledger.pdf");
        }

        document.addEventListener('DOMContentLoaded', renderActiveLedgerGrid);
    </script>
</body>
</html>
