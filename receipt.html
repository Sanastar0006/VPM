<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Receipts Hub | VP MICROFINANCE PRO 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: sans-serif; background: #0b0f19; color: #e2e8f0; }
        .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
    </style>
</head>
<body class="p-6">
    <div class="max-w-7xl mx-auto space-y-6">
        <h2 class="text-xl font-bold text-white"><i class="fa-solid fa-receipt text-purple-500"></i> Customer Collections Receipts Registry</h2>
        <div class="glass-card rounded-2xl p-4 overflow-x-auto">
            <table class="w-full text-left text-xs">
                <thead class="text-slate-400 border-b border-white/10 uppercase">
                    <tr>
                        <th class="p-3">Date</th>
                        <th class="p-3">Receipt No</th>
                        <th class="p-3">Account No</th>
                        <th class="p-3">Customer Name</th>
                        <th class="p-3">Mode</th>
                        <th class="p-3">Amount</th>
                        <th class="p-3 text-center">Actions</th>
                    </tr>
                </thead>
                <tbody id="receiptTableBody" class="divide-y divide-white/5"></tbody>
            </table>
        </div>
    </div>

    <!-- Modal for Viewing / Printing Duplicate Receipt -->
    <div id="viewModal" class="fixed inset-0 bg-black/80 hidden flex items-center justify-center p-4">
        <div id="receiptPrintArea" class="bg-white text-black p-6 rounded-xl max-w-md w-full relative">
            <div id="watermark" class="absolute inset-0 flex items-center justify-center text-4xl font-extrabold text-slate-200/50 rotate-45 select-none pointer-events-none">WATERMARK</div>
            <h3 class="text-center font-bold text-lg uppercase border-b pb-2">VP Microfinance Pro</h3>
            <div id="modalContent" class="py-4 space-y-2 text-xs"></div>
            <div class="flex justify-end gap-2 mt-4 no-print">
                <button onclick="closeModal()" class="px-3 py-1 bg-gray-300 text-black rounded">Close</button>
                <button onclick="window.print()" class="px-3 py-1 bg-purple-600 text-white rounded">Print</button>
            </div>
        </div>
    </div>

    <script>
        function loadReceipts() {
            const receipts = JSON.parse(localStorage.getItem('vp_receipts')) || [];
            const tbody = document.getElementById('receiptTableBody');
            tbody.innerHTML = '';
            
            receipts.forEach((r, idx) => {
                let row = `
                <tr>
                    <td class="p-3">${r.date}</td>
                    <td class="p-3 font-mono text-purple-400">${r.receiptNo}</td>
                    <td class="p-3 font-mono">${r.accountNo}</td>
                    <td class="p-3">${r.customerName}</td>
                    <td class="p-3">${r.paymentMode}</td>
                    <td class="p-3 font-bold text-emerald-400">₹${parseFloat(r.amount).toFixed(2)}</td>
                    <td class="p-3 flex justify-center gap-2">
                        <button onclick="viewReceipt(${idx})" class="p-1.5 bg-blue-600/30 text-blue-400 rounded"><i class="fa-solid fa-eye"></i> View</button>
                        <button onclick="editDate(${idx})" class="p-1.5 bg-amber-600/30 text-amber-400 rounded"><i class="fa-solid fa-calendar"></i> Edit Date</button>
                        <button onclick="reprintReceipt(${idx})" class="p-1.5 bg-purple-600/30 text-purple-400 rounded"><i class="fa-solid fa-print"></i> Duplicate Print</button>
                        <button onclick="shareWhatsapp(${idx})" class="p-1.5 bg-emerald-600/30 text-emerald-400 rounded"><i class="fa-brands fa-whatsapp"></i></button>
                        <button onclick="copyReceipt(${idx})" class="p-1.5 bg-slate-600/30 text-slate-300 rounded"><i class="fa-solid fa-copy"></i></button>
                        <button onclick="deleteReceipt(${idx})" class="p-1.5 bg-rose-600/30 text-rose-400 rounded"><i class="fa-solid fa-trash"></i></button>
                    </td>
                </tr>`;
                tbody.innerHTML += row;
            });
        }

        function viewReceipt(i) {
            const r = JSON.parse(localStorage.getItem('vp_receipts'))[i];
            document.getElementById('watermark').innerText = "VIEW ONLY";
            document.getElementById('modalContent').innerHTML = `
                <p><b>Receipt No:</b> ${r.receiptNo}</p><p><b>Date:</b> ${r.date}</p>
                <p><b>Customer:</b> ${r.customerName} (${r.accountNo})</p>
                <p><b>Amount Paid:</b> ₹${r.amount}</p><p><b>Mode:</b> ${r.paymentMode}</p>
                <p><b>Bank / Ref:</b> ${r.bankName} - ${r.refNo}</p>
            `;
            document.getElementById('viewModal').classList.remove('hidden');
        }

        function reprintReceipt(i) {
            const r = JSON.parse(localStorage.getItem('vp_receipts'))[i];
            document.getElementById('watermark').innerText = "DUPLICATE";
            document.getElementById('modalContent').innerHTML = `
                <p class="text-center font-bold text-red-600">*** DUPLICATE RECEIPT ***</p>
                <p><b>Receipt No:</b> ${r.receiptNo}</p><p><b>Date:</b> ${r.date}</p>
                <p><b>Customer:</b> ${r.customerName} (${r.accountNo})</p>
                <p><b>Amount Paid:</b> ₹${r.amount}</p><p><b>Mode:</b> ${r.paymentMode}</p>
            `;
            document.getElementById('viewModal').classList.remove('hidden');
        }

        function editDate(i) {
            let receipts = JSON.parse(localStorage.getItem('vp_receipts'));
            let newDate = prompt("Enter new date (YYYY-MM-DD):", receipts[i].date);
            if (newDate) {
                receipts[i].date = newDate;
                localStorage.setItem('vp_receipts', JSON.stringify(receipts));
                loadReceipts();
            }
        }

        function shareWhatsapp(i) {
            const r = JSON.parse(localStorage.getItem('vp_receipts'))[i];
            let text = `VP Microfinance EMI Receipt\nReceipt: ${r.receiptNo}\nCustomer: ${r.customerName}\nAmount: ₹${r.amount}\nDate: ${r.date}`;
            window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`, '_blank');
        }

        function copyReceipt(i) {
            const r = JSON.parse(localStorage.getItem('vp_receipts'))[i];
            let text = `Receipt: ${r.receiptNo} | Cust: ${r.customerName} | Amt: ₹${r.amount} | Date: ${r.date}`;
            navigator.clipboard.writeText(text);
            alert("Receipt details copied to clipboard!");
        }

        function deleteReceipt(i) {
            if (confirm("Are you sure you want to delete this receipt?")) {
                let receipts = JSON.parse(localStorage.getItem('vp_receipts'));
                receipts.splice(i, 1);
                localStorage.setItem('vp_receipts', JSON.stringify(receipts));
                loadReceipts();
            }
        }

        function closeModal() { document.getElementById('viewModal').classList.add('hidden'); }
        window.onload = loadReceipts;
    </script>
</body>
</html>
