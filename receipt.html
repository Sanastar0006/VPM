<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Receipts Ledger | VP MICROFINANCE 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #0b0f19; color: #e2e8f0; }
        .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .watermark { position: absolute; opacity: 0.08; font-size: 5rem; font-weight: 900; transform: rotate(-30deg); pointer-events: none; }
    </style>
</head>
<body class="p-6">
    <div class="max-w-6xl mx-auto space-y-6">
        <div class="flex justify-between items-center glass-card p-4 rounded-2xl">
            <h1 class="text-xl font-bold text-purple-400"><i class="fa-solid fa-receipt"></i> Receipts Ledger Registry</h1>
            <a href="transaction.html" class="px-4 py-2 bg-purple-600 rounded-xl text-xs font-bold">+ New Terminal Entry</a>
        </div>

        <div class="glass-card rounded-2xl p-4 overflow-x-auto">
            <table class="w-full text-left text-xs text-slate-300">
                <thead class="bg-white/5 text-purple-300 uppercase font-mono">
                    <tr>
                        <th class="p-3">Date</th>
                        <th class="p-3">Receipt No</th>
                        <th class="p-3">Account No</th>
                        <th class="p-3">Customer Name</th>
                        <th class="p-3">Mode</th>
                        <th class="p-3">Amount (₹)</th>
                        <th class="p-3 text-center">Functions</th>
                    </tr>
                </thead>
                <tbody id="receiptTableBody" class="divide-y divide-white/5"></tbody>
            </table>
        </div>
    </div>

    <!-- View Modal -->
    <div id="receiptModal" class="fixed inset-0 bg-black/80 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-[#111827] border border-white/10 rounded-2xl p-6 w-full max-w-md relative overflow-hidden">
            <div id="modalWatermark" class="watermark top-1/3 left-10 text-white uppercase">OFFICIAL</div>
            <div id="modalPrintBadge" class="text-center font-bold text-red-500 mb-2 hidden">*** DUPLICATE RECEIPT ***</div>
            <h2 class="text-lg font-bold text-purple-400 border-b border-white/10 pb-2 mb-4 text-center">VP MICROFINANCE RECEIPT</h2>
            
            <div id="modalContent" class="space-y-2 text-xs font-mono"></div>

            <div class="flex justify-end gap-2 mt-6">
                <button onclick="closeModal()" class="px-3 py-1.5 bg-slate-700 rounded-lg text-xs">Close</button>
            </div>
        </div>
    </div>

    <script>
        function loadReceipts() {
            const receipts = JSON.parse(localStorage.getItem('vp_receipts')) || [];
            const tbody = document.getElementById('receiptTableBody');
            tbody.innerHTML = '';

            receipts.forEach((r, idx) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="p-3 font-mono">${r.date}</td>
                    <td class="p-3 font-mono text-purple-400">${r.receiptNo}</td>
                    <td class="p-3 font-mono">${r.accountNo}</td>
                    <td class="p-3 font-semibold">${r.customerName}</td>
                    <td class="p-3"><span class="px-2 py-0.5 bg-purple-500/20 text-purple-300 rounded-md">${r.paymentMode}</span></td>
                    <td class="p-3 font-mono font-bold text-emerald-400">₹${parseFloat(r.amount).toFixed(2)}</td>
                    <td class="p-3 flex justify-center gap-1">
                        <button onclick="viewReceipt(${idx}, false)" title="View" class="p-1.5 bg-blue-600/30 text-blue-400 rounded-lg hover:bg-blue-600 hover:text-white"><i class="fa-solid fa-eye"></i></button>
                        <button onclick="editDate(${idx})" title="Edit Date" class="p-1.5 bg-amber-600/30 text-amber-400 rounded-lg hover:bg-amber-600 hover:text-white"><i class="fa-solid fa-pen-to-square"></i></button>
                        <button onclick="viewReceipt(${idx}, true)" title="Again Print" class="p-1.5 bg-emerald-600/30 text-emerald-400 rounded-lg hover:bg-emerald-600 hover:text-white"><i class="fa-solid fa-print"></i></button>
                        <button onclick="shareWhatsapp(${idx})" title="Send WhatsApp" class="p-1.5 bg-green-600/30 text-green-400 rounded-lg hover:bg-green-600 hover:text-white"><i class="fa-brands fa-whatsapp"></i></button>
                        <button onclick="copyReceiptDetails(${idx})" title="Copy" class="p-1.5 bg-purple-600/30 text-purple-400 rounded-lg hover:bg-purple-600 hover:text-white"><i class="fa-solid fa-copy"></i></button>
                        <button onclick="deleteReceipt(${idx})" title="Delete" class="p-1.5 bg-red-600/30 text-red-400 rounded-lg hover:bg-red-600 hover:text-white"><i class="fa-solid fa-trash"></i></button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function viewReceipt(idx, isDuplicate) {
            const receipts = JSON.parse(localStorage.getItem('vp_receipts')) || [];
            const r = receipts[idx];
            
            document.getElementById('modalPrintBadge').classList.toggle('hidden', !isDuplicate);
            document.getElementById('modalWatermark').innerText = isDuplicate ? "DUPLICATE" : "VERIFIED";

            document.getElementById('modalContent').innerHTML = `
                <p><b>Receipt No:</b> ${r.receiptNo}</p>
                <p><b>Date:</b> ${r.date}</p>
                <p><b>Account No:</b> ${r.accountNo}</p>
                <p><b>Customer:</b> ${r.customerName}</p>
                <p><b>Payment Mode:</b> ${r.paymentMode}</p>
                <p><b>Amount Paid:</b> ₹${parseFloat(r.amount).toFixed(2)}</p>
                <p><b>Made By:</b> ${r.madeBy || 'N/A'}</p>
                ${r.refNo ? `<p><b>Ref/UTR:</b> ${r.refNo}</p>` : ''}
                ${r.bankName ? `<p><b>Bank:</b> ${r.bankName} (${r.ifsc || ''})</p>` : ''}
            `;
            document.getElementById('receiptModal').classList.remove('hidden');
        }

        function closeModal() { document.getElementById('receiptModal').classList.add('hidden'); }

        function editDate(idx) {
            const receipts = JSON.parse(localStorage.getItem('vp_receipts')) || [];
            const newDate = prompt("Enter new Date (YYYY-MM-DD):", receipts[idx].date);
            if(newDate) {
                receipts[idx].date = newDate;
                localStorage.setItem('vp_receipts', JSON.stringify(receipts));
                loadReceipts();
            }
        }

        function shareWhatsapp(idx) {
            const receipts = JSON.parse(localStorage.getItem('vp_receipts')) || [];
            const r = receipts[idx];
            const text = `*VP MICROFINANCE RECEIPT*%0AReceipt No: ${r.receiptNo}%0ACustomer: ${r.customerName}%0AAccount: ${r.accountNo}%0AAmount: ₹${r.amount}%0AMode: ${r.paymentMode}%0ADate: ${r.date}`;
            window.open(`https://api.whatsapp.com/send?text=${text}`, '_blank');
        }

        function copyReceiptDetails(idx) {
            const receipts = JSON.parse(localStorage.getItem('vp_receipts')) || [];
            const r = receipts[idx];
            const text = `VP RECEIPT | ${r.receiptNo} | ${r.customerName} | ₹${r.amount} | ${r.date}`;
            navigator.clipboard.writeText(text);
            alert("Receipt details copied to clipboard!");
        }

        function deleteReceipt(idx) {
            if(confirm("Are you sure to delete this receipt?")) {
                let receipts = JSON.parse(localStorage.getItem('vp_receipts')) || [];
                receipts.splice(idx, 1);
                localStorage.setItem('vp_receipts', JSON.stringify(receipts));
                loadReceipts();
            }
        }

        window.onload = loadReceipts;
    </script>
</body>
</html>
