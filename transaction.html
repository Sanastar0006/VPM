<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collection Entry Pipeline | VP MICROFINANCE PRO 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { font-family: 'Poppins', sans-serif; background: #0b0f19; color: #e2e8f0; }
        .yono-gradient { background: linear-gradient(135deg, #6b21a8 0%, #1e40af 100%); }
        .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .custom-dropdown::-webkit-scrollbar { width: 4px; }
        .custom-dropdown::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen bg-[#060814] text-slate-100 flex">

    <aside id="sidebar" class="w-64 glass-card fixed inset-y-0 left-0 z-50 p-4 m-3 rounded-2xl h-[calc(100vh-24px)] transition-transform duration-300 lg:translate-x-0 -translate-x-full lg:static">
        <div class="flex items-center gap-3 px-2 py-4 border-b border-white/5 mb-6">
            <div class="w-8 h-8 rounded-lg yono-gradient flex items-center justify-center text-white font-bold text-sm shadow-md">VP</div>
            <div>
                <h1 class="text-xs font-bold tracking-wider text-white uppercase">VP Microfinance</h1>
                <p class="text-[10px] text-purple-400 font-medium tracking-wide">Pro 2026 Registry</p>
            </div>
        </div>

        <nav class="space-y-1">
            <a href="index.html" class="flex items-center gap-3 px-3 py-2.5 text-slate-400 hover:text-white rounded-xl text-xs font-medium transition-all duration-200"><i class="fa-solid fa-chart-pie"></i> Dashboard Matrix</a>
            <a href="customer-add.html" class="flex items-center gap-3 px-3 py-2.5 text-slate-400 hover:text-white rounded-xl text-xs font-medium transition-all duration-200"><i class="fa-solid fa-user-plus"></i> Capital Disbursement</a>
            <a href="customer-list.html" class="flex items-center gap-3 px-3 py-2.5 text-slate-400 hover:text-white rounded-xl text-xs font-medium transition-all duration-200"><i class="fa-solid fa-address-book"></i> Customer Ledger</a>
            <a href="transaction.html" class="flex items-center gap-3 px-3 py-2.5 text-white yono-gradient rounded-xl text-xs font-medium shadow-lg transition-all duration-200"><i class="fa-solid fa-money-bill-transfer"></i> EMI Collection Terminal</a>
            <a href="receipt.html" class="flex items-center gap-3 px-3 py-2.5 text-slate-400 hover:text-white rounded-xl text-xs font-medium transition-all duration-200"><i class="fa-solid fa-receipt"></i> Receipts Ledger</a>
            <a href="cash-book.html" class="flex items-center gap-3 px-3 py-2.5 text-slate-400 hover:text-white rounded-xl text-xs font-medium transition-all duration-200"><i class="fa-solid fa-wallet"></i> Cash Book</a>
            <a href="bank-book.html" class="flex items-center gap-3 px-3 py-2.5 text-slate-400 hover:text-white rounded-xl text-xs font-medium transition-all duration-200"><i class="fa-solid fa-building-columns"></i> Bank Book</a>
        </nav>
    </aside>

    <main class="flex-1 lg:pl-6 p-6 overflow-x-hidden">
        <header class="flex items-center justify-between mb-6 pb-4 border-b border-white/5">
            <div class="flex items-center gap-3">
                <button onclick="toggleSidebarLayout()" class="lg:hidden p-2 text-slate-400 hover:text-white glass-card rounded-xl text-xs"><i class="fa-solid fa-bars"></i></button>
                <div>
                    <h2 class="text-base font-semibold text-white tracking-wide">EMI Collection Terminal</h2>
                    <p class="text-xs text-slate-400">Automated ledger parsing structure logs.</p>
                </div>
            </div>
        </header>

        <div class="w-full max-w-2xl glass-card rounded-2xl border border-white/5 p-6 shadow-2xl mx-auto">
            <form id="transactionForm" onsubmit="executeTransactionCommit(event)" class="space-y-5">
                
                <div class="relative">
                    <label class="block text-[10px] text-purple-400 font-semibold mb-1 uppercase tracking-wider">Search Account Number</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400 text-xs"><i class="fa-solid fa-magnifying-glass"></i></span>
                        <input type="text" id="searchAccount" autocomplete="off" onfocus="triggerAccountSearchPipeline()" oninput="triggerAccountSearchPipeline()" placeholder="Click or type to search (e.g., VP-102...)" class="w-full pl-9 pr-4 py-2.5 bg-white/5 border border-slate-700/60 rounded-xl text-white font-mono text-xs focus:outline-none focus:border-purple-500 transition-all">
                    </div>
                    <div id="searchDropdown" class="absolute z-50 left-0 right-0 mt-1 bg-[#0f1524] border border-white/10 rounded-xl shadow-2xl hidden max-h-48 overflow-y-auto custom-dropdown"></div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[10px] text-slate-400 mb-1 uppercase tracking-wider">Customer Legal Identity</label>
                        <input type="text" id="customerName" readonly placeholder="Auto-populated Name" class="w-full px-3 py-2.5 bg-white/[0.02] border border-white/5 rounded-xl text-slate-400 text-xs font-medium focus:outline-none cursor-not-allowed">
                    </div>
                    <div>
                        <label class="block text-[10px] text-slate-400 mb-1 uppercase tracking-wider">Disbursed Loan Principal</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-500 text-xs">₹</span>
                            <input type="text" id="loanAmount" readonly placeholder="0.00" class="w-full pl-7 pr-3 py-2.5 bg-white/[0.02] border border-white/5 rounded-xl text-slate-400 font-mono text-xs focus:outline-none cursor-not-allowed">
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[10px] text-slate-400 mb-1 uppercase tracking-wider">Target EMI Valuation</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-emerald-500 text-xs">₹</span>
                            <input type="text" id="emiAmount" readonly placeholder="0.00" class="w-full pl-7 pr-3 py-2.5 bg-white/[0.02] border border-white/5 rounded-xl text-emerald-400 font-mono font-bold text-xs focus:outline-none cursor-not-allowed">
                        </div>
                    </div>
                    <div>
                        <label class="block text-[10px] text-slate-400 mb-1 uppercase tracking-wider">Scheduled EMI Repayment Date</label>
                        <input type="text" id="emiDate" readonly placeholder="YYYY-MM-DD" class="w-full px-3 py-2.5 bg-white/[0.02] border border-white/5 rounded-xl text-slate-400 text-xs font-medium focus:outline-none cursor-not-allowed">
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-4 border-t border-white/5 pt-4">
                    <div>
                        <label class="block text-[10px] text-amber-400 font-semibold mb-1 uppercase tracking-wider">Payment Mode Channel</label>
                        <select id="paymentMode" required onchange="evaluatePaymentChannelView()" class="w-full px-3 py-2.5 bg-[#0f1524] border border-slate-700/60 rounded-xl text-white text-xs focus:outline-none focus:border-purple-500 transition-all cursor-pointer">
                            <option value="" disabled selected>Select Channel</option>
                            <option value="Cash">Cash</option>
                            <option value="UPI">UPI</option>
                            <option value="Split Payment">Split Payment</option>
                            <option value="NEFT or IMPS">NEFT or IMPS</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] text-amber-400 font-semibold mb-1 uppercase tracking-wider">Collected Real Amount (₹)</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-white text-xs">₹</span>
                            <input type="number" step="0.01" id="collectedAmount" required placeholder="Type collected amount" class="w-full pl-7 pr-3 py-2.5 bg-white/5 border border-slate-700/60 rounded-xl text-white font-mono font-bold text-xs focus:outline-none focus:border-purple-500 transition-all">
                        </div>
                    </div>
                    <div>
                        <label class="block text-[10px] text-amber-400 font-semibold mb-1 uppercase tracking-wider">Made By (Staff / Collector)</label>
                        <select id="madeBy" required class="w-full px-3 py-2.5 bg-[#0f1524] border border-slate-700/60 rounded-xl text-white text-xs focus:outline-none focus:border-purple-500 transition-all cursor-pointer">
                            <option value="" disabled selected>Select Agent</option>
                            <option value="Admin">Admin</option>
                            <option value="Field Officer A">Field Officer A</option>
                            <option value="Field Officer B">Field Officer B</option>
                            <option value="Collection Staff">Collection Staff</option>
                        </select>
                    </div>
                </div>

                <!-- Dynamic Non-Cash Container -->
                <div id="nonCashContainer" class="hidden space-y-4 border-t border-white/5 pt-4 transition-all duration-300">
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-[10px] text-purple-400 font-semibold mb-1 uppercase tracking-wider">Reference No / Txn ID</label>
                            <input type="text" id="referenceNo" placeholder="Enter UPI Ref, UTR, etc." class="w-full px-3 py-2.5 bg-white/5 border border-slate-700/60 rounded-xl text-white font-mono text-xs focus:outline-none focus:border-purple-500 transition-all">
                        </div>
                        <div>
                            <label class="block text-[10px] text-purple-400 font-semibold mb-1 uppercase tracking-wider">Receiving Bank Channel</label>
                            <select id="bankName" onchange="autoPopulateBankMeta()" class="w-full px-3 py-2.5 bg-[#0f1524] border border-slate-700/60 rounded-xl text-white text-xs focus:outline-none focus:border-purple-500 transition-all cursor-pointer">
                                <option value="" disabled selected>Select Bank</option>
                                <option value="State Bank of India">State Bank of India (SBI)</option>
                                <option value="HDFC Bank">HDFC Bank</option>
                                <option value="ICICI Bank">ICICI Bank</option>
                                <option value="Axis Bank">Axis Bank</option>
                                <option value="Indian Bank">Indian Bank</option>
                                <option value="Canara Bank">Canara Bank</option>
                                <option value="Tamilnad Mercantile Bank">Tamilnad Mercantile Bank (TMB)</option>
                            </select>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-[10px] text-slate-400 mb-1 uppercase tracking-wider">IFSC Code</label>
                            <input type="text" id="ifscCode" placeholder="Auto / Custom IFSC" class="w-full px-3 py-2.5 bg-white/5 border border-slate-700/60 rounded-xl text-white font-mono text-xs focus:outline-none focus:border-purple-500 transition-all">
                        </div>
                        <div>
                            <label class="block text-[10px] text-slate-400 mb-1 uppercase tracking-wider">Bank Branch</label>
                            <input type="text" id="bankBranch" placeholder="Branch Name" class="w-full px-3 py-2.5 bg-white/5 border border-slate-700/60 rounded-xl text-white text-xs focus:outline-none focus:border-purple-500 transition-all">
                        </div>
                    </div>
                </div>

                <div class="flex justify-end gap-3 border-t border-white/5 pt-4 mt-2">
                    <button type="reset" onclick="clearTransactionTerminal()" class="px-4 py-2.5 bg-white/5 hover:bg-white/10 text-slate-300 rounded-xl text-xs font-medium transition-all">Clear Terminal</button>
                    <button type="submit" class="px-6 py-2.5 yono-gradient text-white rounded-xl text-xs font-bold tracking-wide shadow-lg hover:opacity-90 transition-all flex items-center gap-2">
                        <i class="fa-solid fa-check-double"></i> Authorize & Save Entry
                    </button>
                </div>
            </form>
        </div>
    </main>

    <script>
        const CLOUD_SYNC_URL = "https://script.google.com/macros/s/AKfycby9Fwl090NE0lUuVmrgiXvFv_V7UGfg4nD9ZezIhabsuEMwS-8QvjE5lkXxQtD3FSZO/exec";

        const BANK_METADATA = {
            "State Bank of India": { ifsc: "SBIN0001234", branch: "Main Branch" },
            "HDFC Bank": { ifsc: "HDFC0000456", branch: "Metro Branch" },
            "ICICI Bank": { ifsc: "ICIC0000789", branch: "Central Branch" },
            "Axis Bank": { ifsc: "UTIB0000321", branch: "Town Branch" },
            "Indian Bank": { ifsc: "IDIB0001122", branch: "West Branch" },
            "Canara Bank": { ifsc: "CNRB0003344", branch: "East Branch" },
            "Tamilnad Mercantile Bank": { ifsc: "TMBL0000555", branch: "South Branch" }
        };

        function toggleSidebarLayout() {
            document.getElementById('sidebar').classList.toggle('-translate-x-full');
        }

        function evaluatePaymentChannelView() {
            const currentMode = document.getElementById('paymentMode').value;
            const nonCashContainer = document.getElementById('nonCashContainer');
            const refInput = document.getElementById('referenceNo');
            const bankInput = document.getElementById('bankName');

            if (currentMode === 'UPI' || currentMode === 'Split Payment' || currentMode === 'NEFT or IMPS') {
                nonCashContainer.classList.remove('hidden');
                refInput.required = true;
                bankInput.required = true;
            } else {
                nonCashContainer.classList.add('hidden');
                refInput.required = false;
                bankInput.required = false;
                refInput.value = ''; bankInput.value = '';
                document.getElementById('ifscCode').value = '';
                document.getElementById('bankBranch').value = '';
            }
        }

        function autoPopulateBankMeta() {
            const bName = document.getElementById('bankName').value;
            if(BANK_METADATA[bName]) {
                document.getElementById('ifscCode').value = BANK_METADATA[bName].ifsc;
                document.getElementById('bankBranch').value = BANK_METADATA[bName].branch;
            }
        }

        function triggerAccountSearchPipeline() {
            const inputVal = document.getElementById('searchAccount').value.toUpperCase().trim();
            const dropdown = document.getElementById('searchDropdown');
            let customers = JSON.parse(localStorage.getItem('vp_local_customers')) || [];
            
            let approvedCustomers = customers.filter(c => {
                let statusVal = (c.status || c.approvalStatus || c.loanStatus || '').toUpperCase();
                return statusVal === 'LOAN APPROVED';
            });

            if (approvedCustomers.length === 0) {
                dropdown.innerHTML = `<div class="px-4 py-3 text-slate-500 text-xs italic">No active approved customers found!</div>`;
                dropdown.classList.remove('hidden');
                return;
            }

            let filtered = approvedCustomers.filter(c => {
                let currentAcNo = (c.accountNo || c.accountNumber || '').toUpperCase();
                return inputVal === '' || currentAcNo.includes(inputVal);
            });

            if (filtered.length === 0) {
                dropdown.innerHTML = `<div class="px-4 py-3 text-slate-500 text-xs italic">Machi, no matching approved accounts found!</div>`;
                dropdown.classList.remove('hidden');
                return;
            }

            dropdown.innerHTML = '';
            filtered.forEach(account => {
                let correctAcNo = account.accountNo || account.accountNumber || 'VP-N/A';
                let correctName = account.customerName || account.name || 'Unknown Identity';
                
                const searchRow = document.createElement('div');
                searchRow.className = "px-4 py-2.5 hover:bg-purple-600/20 text-xs border-b border-white/5 cursor-pointer flex justify-between items-center transition-all group";
                searchRow.innerHTML = `
                    <span class="font-mono font-bold text-purple-400 group-hover:text-white">${correctAcNo}</span>
                    <span class="text-slate-400 text-[11px] group-hover:text-slate-200">${correctName}</span>
                `;
                searchRow.onclick = () => selectTargetAccountProfile(account);
                dropdown.appendChild(searchRow);
            });

            dropdown.classList.remove('hidden');
        }

        function selectTargetAccountProfile(customer) {
            let correctAcNo = customer.accountNo || customer.accountNumber || 'VP-N/A';
            let correctName = customer.customerName || customer.name || 'N/A';
            let correctPrincipal = customer.principal || customer.loanAmount || customer.amount || 0;
            let correctEmi = customer.emi || customer.emiAmount || 0;
            let correctDate = customer.startDate || customer.date || customer.emiDate || new Date().toISOString().split('T')[0];

            document.getElementById('searchAccount').value = correctAcNo;
            document.getElementById('customerName').value = correctName;
            document.getElementById('loanAmount').value = parseFloat(correctPrincipal).toLocaleString('en-IN', {minimumFractionDigits: 2});
            document.getElementById('emiAmount').value = parseFloat(correctEmi).toFixed(2);
            document.getElementById('emiDate').value = correctDate;
            document.getElementById('collectedAmount').value = parseFloat(correctEmi) || '';
            document.getElementById('searchDropdown').classList.add('hidden');
        }

        document.addEventListener('click', (e) => {
            const dropdown = document.getElementById('searchDropdown');
            const searchInput = document.getElementById('searchAccount');
            if (e.target !== dropdown && e.target !== searchInput) dropdown.classList.add('hidden');
        });

        function clearTransactionTerminal() {
            document.getElementById('searchDropdown').classList.add('hidden');
            document.getElementById('nonCashContainer').classList.add('hidden');
            document.getElementById('transactionForm').reset();
        }

        function executeTransactionCommit(e) {
            e.preventDefault();
            
            const acNo = document.getElementById('searchAccount').value.trim();
            const name = document.getElementById('customerName').value;
            const mode = document.getElementById('paymentMode').value;
            const amt = parseFloat(document.getElementById('collectedAmount').value) || 0;
            const madeBy = document.getElementById('madeBy').value;
            const refNo = document.getElementById('referenceNo').value.trim();
            const bankName = document.getElementById('bankName').value;
            const ifsc = document.getElementById('ifscCode').value;
            const branch = document.getElementById('bankBranch').value;

            if(!name || name === 'Auto-populated Name') {
                alert("⚠️ Choose a valid registered account!");
                return;
            }

            const today = new Date().toISOString().split('T')[0];
            const receiptNo = "REC-" + Date.now().toString().slice(-6);
            const voucherNo = "VOUCH-" + Date.now().toString().slice(-5);

            // 1. Receipt Payload
            let receipts = JSON.parse(localStorage.getItem('vp_receipts')) || [];
            let receiptObj = {
                receiptNo: receiptNo,
                date: today,
                accountNo: acNo,
                customerName: name,
                paymentMode: mode,
                amount: amt,
                madeBy: madeBy,
                refNo: refNo,
                bankName: bankName,
                ifsc: ifsc,
                branch: branch
            };
            receipts.push(receiptObj);
            localStorage.setItem('vp_receipts', JSON.stringify(receipts));

            // 2. Routing to Cash Book or Bank Book
            if(mode === 'Cash') {
                let cashEntries = JSON.parse(localStorage.getItem('vp_cash_book')) || [];
                cashEntries.push({
                    date: today,
                    voucherNo: voucherNo,
                    particulars: `EMI Collected from ${name} (${acNo})`,
                    paymentMode: 'Cash',
                    amount: amt,
                    type: 'CREDIT', // Credit to cash box
                    madeBy: madeBy
                });
                localStorage.setItem('vp_cash_book', JSON.stringify(cashEntries));
            } else {
                let bankEntries = JSON.parse(localStorage.getItem('vp_bank_book')) || [];
                bankEntries.push({
                    date: today,
                    voucherNo: voucherNo,
                    particulars: `EMI Collected from ${name} (${acNo}) - Ref: ${refNo}`,
                    paymentMode: mode,
                    amount: amt,
                    type: 'CREDIT',
                    madeBy: madeBy,
                    bankName: bankName
                });
                localStorage.setItem('vp_bank_book', JSON.stringify(bankEntries));
            }

            alert(`✅ Transaction Successful!\nReceipt No: ${receiptNo}\nVoucher No: ${voucherNo}\nSaved to ${mode === 'Cash' ? 'Cash Book' : 'Bank Book'} & Receipts!`);
            clearTransactionTerminal();
            window.location.href = "receipt.html";
        }
    </script>
</body>
</html>
