<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collection & Accounts Terminal | VP MICROFINANCE PRO 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { font-family: 'Poppins', sans-serif; background: #0b0f19; color: #e2e8f0; }
        .yono-gradient { background: linear-gradient(135deg, #6b21a8 0%, #1e40af 100%); }
        .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .custom-dropdown::-webkit-scrollbar { width: 4px; }
        .custom-dropdown::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen bg-[#060814] text-slate-100 flex">

    <!-- Sidebar -->
    <aside id="sidebar" class="w-64 glass-card fixed inset-y-0 left-0 z-50 p-4 m-3 rounded-2xl h-[calc(100vh-24px)] transition-transform duration-300 lg:translate-x-0 -translate-x-full lg:static">
        <div class="flex items-center gap-3 px-2 py-4 border-b border-white/5 mb-6">
            <div class="w-8 h-8 rounded-lg yono-gradient flex items-center justify-center text-white font-bold text-sm shadow-md">VP</div>
            <div>
                <h1 class="text-xs font-bold tracking-wider text-white uppercase">VP Microfinance</h1>
                <p class="text-[10px] text-purple-400 font-medium tracking-wide">Pro 2026 Registry</p>
            </div>
        </div>

        <nav class="space-y-1">
            <a href="index.html" class="flex items-center gap-3 px-3 py-2.5 text-slate-400 hover:text-white rounded-xl text-xs font-medium"><i class="fa-solid fa-chart-pie"></i> Dashboard Matrix</a>
            <a href="customer-add.html" class="flex items-center gap-3 px-3 py-2.5 text-slate-400 hover:text-white rounded-xl text-xs font-medium"><i class="fa-solid fa-user-plus"></i> Capital Disbursement</a>
            <a href="customer-list.html" class="flex items-center gap-3 px-3 py-2.5 text-slate-400 hover:text-white rounded-xl text-xs font-medium"><i class="fa-solid fa-address-book"></i> Customer Ledger</a>
            <a href="transaction.html" class="flex items-center gap-3 px-3 py-2.5 text-white yono-gradient rounded-xl text-xs font-medium shadow-lg"><i class="fa-solid fa-money-bill-transfer"></i> Entry Terminal</a>
            <a href="receipt.html" class="flex items-center gap-3 px-3 py-2.5 text-slate-400 hover:text-white rounded-xl text-xs font-medium"><i class="fa-solid fa-receipt"></i> Receipts Hub</a>
            <a href="cash-book.html" class="flex items-center gap-3 px-3 py-2.5 text-slate-400 hover:text-white rounded-xl text-xs font-medium"><i class="fa-solid fa-wallet"></i> Cash Book</a>
            <a href="bank-book.html" class="flex items-center gap-3 px-3 py-2.5 text-slate-400 hover:text-white rounded-xl text-xs font-medium"><i class="fa-solid fa-building-columns"></i> Bank Book</a>
        </nav>
    </aside>

    <main class="flex-1 lg:pl-6 p-6 overflow-x-hidden">
        <header class="flex items-center justify-between mb-6 pb-4 border-b border-white/5">
            <div class="flex items-center gap-3">
                <button onclick="toggleSidebarLayout()" class="lg:hidden p-2 text-slate-400 hover:text-white glass-card rounded-xl text-xs"><i class="fa-solid fa-bars"></i></button>
                <div>
                    <h2 class="text-base font-semibold text-white tracking-wide">Collection & Accounts Terminal</h2>
                    <p class="text-xs text-slate-400">Integrated Microfinance Multi-Ledger Entry Terminal</p>
                </div>
            </div>
        </header>

        <!-- Entry Mode Selectors -->
        <div class="w-full max-w-2xl mx-auto mb-6 flex justify-center gap-4 bg-white/5 p-2 rounded-2xl border border-white/10">
            <label class="flex items-center gap-2 px-6 py-2.5 rounded-xl cursor-pointer transition-all border border-transparent has-[:checked]:bg-purple-600 has-[:checked]:text-white text-slate-400 text-xs font-semibold">
                <input type="radio" name="terminalMode" value="CUSTOMER_RECEIPT" checked onchange="switchTerminalMode()" class="hidden">
                <i class="fa-solid fa-receipt"></i> Customer Receipt
            </label>
            <label class="flex items-center gap-2 px-6 py-2.5 rounded-xl cursor-pointer transition-all border border-transparent has-[:checked]:bg-purple-600 has-[:checked]:text-white text-slate-400 text-xs font-semibold">
                <input type="radio" name="terminalMode" value="ACCOUNT_TRANSACTION" onchange="switchTerminalMode()" class="hidden">
                <i class="fa-solid fa-calculator"></i> Accounts Transaction
            </label>
        </div>

        <div class="w-full max-w-2xl glass-card rounded-2xl border border-white/5 p-6 shadow-2xl mx-auto">
            <form id="transactionForm" onsubmit="executeTransactionCommit(event)" class="space-y-5">
                
                <!-- Common Date & Voucher/Receipt Header -->
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[10px] text-purple-400 font-semibold mb-1 uppercase tracking-wider">Txn / Entry Date</label>
                        <input type="date" id="entryDate" required class="w-full px-3 py-2 bg-[#0f1524] border border-slate-700/60 rounded-xl text-white text-xs">
                    </div>
                    <div>
                        <label class="block text-[10px] text-purple-400 font-semibold mb-1 uppercase tracking-wider">Made By (Collector / Staff)</label>
                        <select id="madeBy" required class="w-full px-3 py-2 bg-[#0f1524] border border-slate-700/60 rounded-xl text-white text-xs">
                            <option value="" disabled selected>Select Staff</option>
                            <option value="Admin / Branch Mgr">Admin / Branch Mgr</option>
                            <option value="Field Officer 1">Field Officer 1</option>
                            <option value="Field Officer 2">Field Officer 2</option>
                            <option value="Cashier">Cashier</option>
                        </select>
                    </div>
                </div>

                <!-- SECTION 1: CUSTOMER RECEIPT MODULE -->
                <div id="customerReceiptSection" class="space-y-4">
                    <div class="relative">
                        <label class="block text-[10px] text-purple-400 font-semibold mb-1 uppercase tracking-wider">Search Account Number / Customer</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400 text-xs"><i class="fa-solid fa-magnifying-glass"></i></span>
                            <input type="text" id="searchAccount" autocomplete="off" onfocus="triggerAccountSearchPipeline()" oninput="triggerAccountSearchPipeline()" placeholder="Click or type to search (e.g., VP-102 or Name...)" class="w-full pl-9 pr-4 py-2.5 bg-white/5 border border-slate-700/60 rounded-xl text-white font-mono text-xs focus:outline-none focus:border-purple-500">
                        </div>
                        <div id="searchDropdown" class="absolute z-50 left-0 right-0 mt-1 bg-[#0f1524] border border-white/10 rounded-xl shadow-2xl hidden max-h-48 overflow-y-auto custom-dropdown"></div>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-[10px] text-slate-400 mb-1 uppercase">Customer Legal Name</label>
                            <input type="text" id="customerName" readonly placeholder="Auto-populated Name" class="w-full px-3 py-2 bg-white/[0.02] border border-white/5 rounded-xl text-slate-400 text-xs focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-[10px] text-slate-400 mb-1 uppercase">Target EMI Valuation</label>
                            <input type="text" id="emiAmount" readonly placeholder="0.00" class="w-full px-3 py-2 bg-white/[0.02] border border-white/5 rounded-xl text-emerald-400 font-mono font-bold text-xs focus:outline-none">
                        </div>
                    </div>
                </div>

                <!-- SECTION 2: ACCOUNTS TRANSACTION MODULE -->
                <div id="accountTxnSection" class="hidden space-y-4">
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-[10px] text-purple-400 font-semibold mb-1 uppercase">Account Head</label>
                            <select id="accountHead" onchange="populateLedgerHeads()" class="w-full px-3 py-2 bg-[#0f1524] border border-slate-700/60 rounded-xl text-white text-xs">
                                <option value="" disabled selected>Select Head</option>
                                <option value="Income">Income</option>
                                <option value="Payment">Payment</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[10px] text-purple-400 font-semibold mb-1 uppercase">Ledger Head</label>
                            <select id="ledgerHead" class="w-full px-3 py-2 bg-[#0f1524] border border-slate-700/60 rounded-xl text-white text-xs">
                                <option value="" disabled selected>Select Account Head First</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-[10px] text-slate-400 mb-1 uppercase">Particulars / Details</label>
                        <input type="text" id="txnParticulars" placeholder="Enter transaction note or party details" class="w-full px-3 py-2 bg-white/5 border border-slate-700/60 rounded-xl text-white text-xs">
                    </div>
                </div>

                <!-- Shared Payment Details -->
                <div class="grid grid-cols-2 gap-4 border-t border-white/5 pt-4">
                    <div>
                        <label class="block text-[10px] text-amber-400 font-semibold mb-1 uppercase">Payment Channel Mode</label>
                        <select id="paymentMode" required onchange="evaluatePaymentChannelView()" class="w-full px-3 py-2.5 bg-[#0f1524] border border-slate-700/60 rounded-xl text-white text-xs">
                            <option value="" disabled selected>Select Channel</option>
                            <option value="Cash">Cash</option>
                            <option value="UPI">UPI</option>
                            <option value="Split Payment">Split Payment</option>
                            <option value="NEFT or IMPS">NEFT or IMPS</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] text-amber-400 font-semibold mb-1 uppercase">Transaction Amount (₹)</label>
                        <input type="number" step="0.01" id="collectedAmount" required placeholder="0.00" class="w-full px-3 py-2.5 bg-white/5 border border-slate-700/60 rounded-xl text-white font-mono font-bold text-xs">
                    </div>
                </div>

                <!-- Dynamic Non-Cash Container (Bank, IFSC, Branch, Ref) -->
                <div id="nonCashContainer" class="hidden grid grid-cols-2 gap-4 border-t border-white/5 pt-4">
                    <div>
                        <label class="block text-[10px] text-purple-400 font-semibold mb-1 uppercase">Receiving Bank</label>
                        <select id="bankName" onchange="autoFillBankDetails()" class="w-full px-3 py-2 bg-[#0f1524] border border-slate-700/60 rounded-xl text-white text-xs">
                            <option value="" disabled selected>Select Bank</option>
                            <option value="State Bank of India">State Bank of India (SBI)</option>
                            <option value="HDFC Bank">HDFC Bank</option>
                            <option value="ICICI Bank">ICICI Bank</option>
                            <option value="Axis Bank">Axis Bank</option>
                            <option value="Canara Bank">Canara Bank</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] text-purple-400 font-semibold mb-1 uppercase">Ref No / UTR / Txn ID</label>
                        <input type="text" id="referenceNo" placeholder="Enter Ref/UTR" class="w-full px-3 py-2 bg-white/5 border border-slate-700/60 rounded-xl text-white font-mono text-xs">
                    </div>
                    <div>
                        <label class="block text-[10px] text-slate-400 mb-1 uppercase">IFSC Code</label>
                        <select id="ifscCode" class="w-full px-3 py-2 bg-[#0f1524] border border-slate-700/60 rounded-xl text-white text-xs">
                            <option value="SBIN0001234">SBIN0001234</option>
                            <option value="HDFC0005678">HDFC0005678</option>
                            <option value="ICIC0009101">ICIC0009101</option>
                            <option value="UTIB0001122">UTIB0001122</option>
                            <option value="CNRB0003344">CNRB0003344</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] text-slate-400 mb-1 uppercase">Branch Name</label>
                        <select id="branchName" class="w-full px-3 py-2 bg-[#0f1524] border border-slate-700/60 rounded-xl text-white text-xs">
                            <option value="Main Branch">Main Branch</option>
                            <option value="City Center">City Center</option>
                            <option value="North Zone">North Zone</option>
                            <option value="South Hub">South Hub</option>
                        </select>
                    </div>
                </div>

                <div class="flex justify-end gap-3 border-t border-white/5 pt-4">
                    <button type="button" onclick="clearTerminal()" class="px-4 py-2 bg-white/5 text-slate-300 rounded-xl text-xs font-medium">Clear</button>
                    <button type="submit" class="px-6 py-2 yono-gradient text-white rounded-xl text-xs font-bold shadow-lg">
                        <i class="fa-solid fa-check-double"></i> Authorize & Save Entry
                    </button>
                </div>
            </form>
        </div>
    </main>

    <script>
        let selectedCustomerObj = null;

        document.getElementById('entryDate').value = new Date().toISOString().split('T')[0];

        function toggleSidebarLayout() {
            document.getElementById('sidebar').classList.toggle('-translate-x-full');
        }

        function switchTerminalMode() {
            const mode = document.querySelector('input[name="terminalMode"]:checked').value;
            const custSec = document.getElementById('customerReceiptSection');
            const acSec = document.getElementById('accountTxnSection');

            if (mode === 'CUSTOMER_RECEIPT') {
                custSec.classList.remove('hidden');
                acSec.classList.add('hidden');
            } else {
                custSec.classList.add('hidden');
                acSec.classList.remove('hidden');
            }
        }

        // Microfinance Ledger Head Options
        const ledgerOptions = {
            Income: [
                "Interbranch Income", "FD Amount Deposit", "Cash In Bank", "Loan Processing Fee", 
                "Late EMI Fine Charges", "Legal Fee Recovery", "Interest Incomes", "Passbook Charges"
            ],
            Payment: [
                "Office Expenses", "Office Maintenance", "Repair and Maintenance", "Salary", 
                "Travel Expenses", "Salary Advance", "Petrol Expenses", "Printing & Stationery", 
                "Audit Fees", "Tea & Refreshments"
            ]
        };

        function populateLedgerHeads() {
            const head = document.getElementById('accountHead').value;
            const ledgerSelect = document.getElementById('ledgerHead');
            ledgerSelect.innerHTML = '<option value="" disabled selected>Select Ledger Head</option>';
            
            if (ledgerOptions[head]) {
                ledgerOptions[head].forEach(item => {
                    let opt = document.createElement('option');
                    opt.value = item;
                    opt.innerText = item;
                    ledgerSelect.appendChild(opt);
                });
            }
        }

        function evaluatePaymentChannelView() {
            const currentMode = document.getElementById('paymentMode').value;
            const container = document.getElementById('nonCashContainer');
            if (currentMode !== 'Cash' && currentMode !== '') {
                container.classList.remove('hidden');
            } else {
                container.classList.add('hidden');
            }
        }

        function autoFillBankDetails() {
            const bank = document.getElementById('bankName').value;
            const ifsc = document.getElementById('ifscCode');
            if(bank.includes('SBI')) ifsc.value = 'SBIN0001234';
            else if(bank.includes('HDFC')) ifsc.value = 'HDFC0005678';
            else if(bank.includes('ICICI')) ifsc.value = 'ICIC0009101';
            else if(bank.includes('Axis')) ifsc.value = 'UTIB0001122';
            else if(bank.includes('Canara')) ifsc.value = 'CNRB0003344';
        }

        // Consolidated LocalStorage Fetcher (Avoids Data-Loss across multiple keys)
        function fetchAllCustomersFromStorage() {
            const local1 = JSON.parse(localStorage.getItem('vp_local_customers')) || [];
            const local2 = JSON.parse(localStorage.getItem('vp_customers')) || [];
            
            const combinedMap = new Map();
            [...local1, ...local2].forEach(item => {
                const keyAc = (item.accountNo || item.accNo || item.accountNumber || '').toString().trim();
                if (keyAc && !combinedMap.has(keyAc)) {
                    combinedMap.set(keyAc, item);
                }
            });
            return Array.from(combinedMap.values());
        }

        // Dynamic Account Search Pipeline with Flexible Status Checking
        function triggerAccountSearchPipeline() {
            const inputVal = document.getElementById('searchAccount').value.toUpperCase().trim();
            const dropdown = document.getElementById('searchDropdown');
            const allCustomers = fetchAllCustomersFromStorage();

            if (allCustomers.length === 0) {
                dropdown.innerHTML = `<div class="px-4 py-3 text-slate-500 text-xs italic">No stored customers found in system!</div>`;
                dropdown.classList.remove('hidden');
                return;
            }

            // Flexible filter: checks status if present, otherwise returns all available accounts
            let approvedCustomers = allCustomers.filter(c => {
                let statusVal = (c.status || c.approvalStatus || c.loanStatus || '').toString().toUpperCase();
                return statusVal === '' || statusVal.includes('APPROVED') || statusVal.includes('ACTIVE');
            });

            let filtered = approvedCustomers.filter(c => {
                let currentAcNo = (c.accountNo || c.accNo || c.accountNumber || '').toString().toUpperCase();
                let currentName = (c.customerName || c.name || '').toString().toUpperCase();
                return inputVal === '' || currentAcNo.includes(inputVal) || currentName.includes(inputVal);
            });

            if (filtered.length === 0) {
                dropdown.innerHTML = `<div class="px-4 py-3 text-slate-500 text-xs italic">Machi, no active accounts match search!</div>`;
                dropdown.classList.remove('hidden');
                return;
            }

            dropdown.innerHTML = '';
            filtered.forEach(account => {
                let correctAcNo = account.accountNo || account.accNo || account.accountNumber || 'VP-N/A';
                let correctName = account.customerName || account.name || 'Unknown';
                let correctEmi = account.emi || account.emiAmount || 0;

                const searchRow = document.createElement('div');
                searchRow.className = "px-4 py-2 hover:bg-purple-600/20 text-xs cursor-pointer flex justify-between items-center transition-all";
                searchRow.innerHTML = `
                    <div>
                        <span class="font-mono text-purple-400 font-bold mr-2">${correctAcNo}</span>
                        <span class="text-slate-200">${correctName}</span>
                    </div>
                    <span class="text-emerald-400 font-mono text-[11px]">₹${parseFloat(correctEmi).toFixed(2)}</span>
                `;
                searchRow.onclick = () => selectAccount(account);
                dropdown.appendChild(searchRow);
            });

            dropdown.classList.remove('hidden');
        }

        function selectAccount(cust) {
            selectedCustomerObj = cust;
            const correctAcNo = cust.accountNo || cust.accNo || cust.accountNumber || 'VP-N/A';
            const correctName = cust.customerName || cust.name || 'N/A';
            const correctEmi = cust.emi || cust.emiAmount || 0;

            document.getElementById('searchAccount').value = correctAcNo;
            document.getElementById('customerName').value = correctName;
            document.getElementById('emiAmount').value = parseFloat(correctEmi).toFixed(2);
            document.getElementById('collectedAmount').value = parseFloat(correctEmi) || '';
            document.getElementById('searchDropdown').classList.add('hidden');
        }

        // Close search dropdown on clicking outside
        document.addEventListener('click', (e) => {
            const dropdown = document.getElementById('searchDropdown');
            const searchInput = document.getElementById('searchAccount');
            if (e.target !== dropdown && e.target !== searchInput) {
                dropdown.classList.add('hidden');
            }
        });

        function clearTerminal() {
            selectedCustomerObj = null;
            document.getElementById('transactionForm').reset();
            document.getElementById('nonCashContainer').classList.add('hidden');
            document.getElementById('searchDropdown').classList.add('hidden');
            document.getElementById('customerName').value = '';
            document.getElementById('emiAmount').value = '';
            document.getElementById('entryDate').value = new Date().toISOString().split('T')[0];
        }

        function executeTransactionCommit(e) {
            e.preventDefault();
            const mode = document.querySelector('input[name="terminalMode"]:checked').value;
            const date = document.getElementById('entryDate').value;
            const madeBy = document.getElementById('madeBy').value;
            const paymentMode = document.getElementById('paymentMode').value;
            const amount = parseFloat(document.getElementById('collectedAmount').value) || 0;
            const voucherNo = 'VOU-' + Math.floor(100000 + Math.random() * 900000);
            const receiptNo = 'REC-' + Math.floor(100000 + Math.random() * 900000);

            let bankName = paymentMode === 'Cash' ? 'N/A' : (document.getElementById('bankName').value || 'N/A');
            let ifsc = paymentMode === 'Cash' ? 'N/A' : (document.getElementById('ifscCode').value || 'N/A');
            let branch = paymentMode === 'Cash' ? 'N/A' : (document.getElementById('branchName').value || 'N/A');
            let refNo = paymentMode === 'Cash' ? 'N/A (Cash)' : (document.getElementById('referenceNo').value || 'N/A');

            let particularDetails = "";
            let custAcNo = "N/A";
            let custName = "N/A";

            if (mode === 'CUSTOMER_RECEIPT') {
                custAcNo = document.getElementById('searchAccount').value;
                custName = document.getElementById('customerName').value;

                if(!custAcNo || !custName) {
                    alert("⚠️ Select a valid account number from the search list!");
                    return;
                }

                particularDetails = `EMI Receipt - ${custName} (${custAcNo})`;

                // Save to Receipts Registry
                let receipts = JSON.parse(localStorage.getItem('vp_receipts')) || [];
                receipts.push({
                    receiptNo, date, accountNo: custAcNo, customerName: custName,
                    paymentMode, amount, madeBy, bankName, ifsc, branch, refNo
                });
                localStorage.setItem('vp_receipts', JSON.stringify(receipts));

                // Deduct Outstanding balance in LocalStorage
                ['vp_local_customers', 'vp_customers'].forEach(key => {
                    let cList = JSON.parse(localStorage.getItem(key)) || [];
                    let idx = cList.findIndex(x => (x.accountNo || x.accNo || x.accountNumber) === custAcNo);
                    if (idx !== -1) {
                        let currentBal = parseFloat(cList[idx].totalOutstanding || cList[idx].outstanding || 0);
                        cList[idx].totalOutstanding = Math.max(0, currentBal - amount);
                        localStorage.setItem(key, JSON.stringify(cList));
                    }
                });

            } else {
                const head = document.getElementById('accountHead').value;
                const ledger = document.getElementById('ledgerHead').value;
                const note = document.getElementById('txnParticulars').value;
                particularDetails = `[${head} - ${ledger}] ${note}`;
            }

            // Save Entry to Cash Book or Bank Book
            let ledgerEntry = {
                date, voucherNo, particular: particularDetails, paymentMode,
                amount, madeBy, type: mode === 'ACCOUNT_TRANSACTION' && document.getElementById('accountHead').value === 'Payment' ? 'DEBIT' : 'CREDIT'
            };

            if (paymentMode === 'Cash') {
                let cashBook = JSON.parse(localStorage.getItem('vp_cash_book')) || [];
                cashBook.push(ledgerEntry);
                localStorage.setItem('vp_cash_book', JSON.stringify(cashBook));
            } else {
                let bankBook = JSON.parse(localStorage.getItem('vp_bank_book')) || [];
                bankBook.push(ledgerEntry);
                localStorage.setItem('vp_bank_book', JSON.stringify(bankBook));
            }

            alert(`✅ Entry Executed Successfully Machi!\nVoucher/Receipt: ${mode === 'CUSTOMER_RECEIPT' ? receiptNo : voucherNo}`);
            clearTerminal();
        }
    </script>
    <script src="role-access.js"></script>
</body>
</html>
