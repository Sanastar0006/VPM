<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entry Terminal | VP MICROFINANCE PRO 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #060814; color: #e2e8f0; }
        .yono-gradient { background: linear-gradient(135deg, #6b21a8 0%, #1e40af 100%); }
        .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
    </style>
</head>
<body class="min-h-screen bg-[#060814] text-slate-100 flex">

    <!-- Sidebar -->
    <aside id="sidebar" class="w-64 glass-card fixed inset-y-0 left-0 z-50 p-4 m-3 rounded-2xl h-[calc(100vh-24px)] transition-transform duration-300 lg:translate-x-0 -translate-x-full lg:static">
        <div class="flex items-center gap-3 px-2 py-4 border-b border-white/5 mb-6">
            <div class="w-8 h-8 rounded-lg yono-gradient flex items-center justify-center text-white font-bold text-sm shadow-md">VP</div>
            <div>
                <h1 class="text-xs font-bold tracking-wider text-white uppercase">VP Microfinance</h1>
                <p class="text-[10px] text-purple-400 font-medium tracking-wide">Pro 2026 Registry</p>
            </div>
        </div>

        <nav class="space-y-1">
            <a href="index.html" class="flex items-center gap-3 px-3 py-2.5 text-slate-400 hover:text-white rounded-xl text-xs font-medium"><i class="fa-solid fa-chart-pie"></i> Dashboard Matrix</a>
            <a href="customer-add.html" class="flex items-center gap-3 px-3 py-2.5 text-slate-400 hover:text-white rounded-xl text-xs font-medium"><i class="fa-solid fa-user-plus"></i> Capital Disbursement</a>
            <a href="customer-list.html" class="flex items-center gap-3 px-3 py-2.5 text-slate-400 hover:text-white rounded-xl text-xs font-medium"><i class="fa-solid fa-address-book"></i> Customer Ledger</a>
            <a href="passbook.html" class="flex items-center gap-3 px-3 py-2.5 text-slate-400 hover:text-white rounded-xl text-xs font-medium"><i class="fa-solid fa-book-open"></i> Customer Passbook</a>
            <a href="transaction.html" class="flex items-center gap-3 px-3 py-2.5 text-white yono-gradient rounded-xl text-xs font-medium shadow-lg"><i class="fa-solid fa-money-bill-transfer"></i> Entry Terminal</a>
            <a href="receipt.html" class="flex items-center gap-3 px-3 py-2.5 text-slate-400 hover:text-white rounded-xl text-xs font-medium"><i class="fa-solid fa-receipt"></i> Receipts Hub</a>
            <a href="cash-book.html" class="flex items-center gap-3 px-3 py-2.5 text-slate-400 hover:text-white rounded-xl text-xs font-medium"><i class="fa-solid fa-wallet"></i> Cash Book</a>
            <a href="bank-book.html" class="flex items-center gap-3 px-3 py-2.5 text-slate-400 hover:text-white rounded-xl text-xs font-medium"><i class="fa-solid fa-building-columns"></i> Bank Book</a>
        </nav>
    </aside>

    <main class="flex-1 lg:pl-6 p-6 overflow-x-hidden">
        <header class="flex items-center justify-between mb-6 pb-4 border-b border-white/5">
            <div class="flex items-center gap-3">
                <button onclick="toggleSidebarLayout()" class="lg:hidden p-2 text-slate-400 hover:text-white glass-card rounded-xl text-xs"><i class="fa-solid fa-bars"></i></button>
                <div>
                    <h2 class="text-base font-semibold text-white tracking-wide">Collection & Accounts Terminal</h2>
                    <p class="text-xs text-slate-400">Integrated Microfinance Multi-Ledger Entry Terminal</p>
                </div>
            </div>
        </header>

        <div class="max-w-4xl mx-auto space-y-6">
            <!-- Form Container -->
            <div class="glass-card rounded-2xl p-6 border border-white/5 space-y-6">
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[10px] font-bold text-purple-400 uppercase mb-1">TXN / Entry Date</label>
                        <input type="date" id="txnDate" class="w-full bg-slate-900/80 border border-slate-700/60 rounded-xl px-3 py-2 text-xs text-white">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-purple-400 uppercase mb-1">Made By (Collector / Staff)</label>
                        <select id="collectorStaff" class="w-full bg-slate-900/80 border border-slate-700/60 rounded-xl px-3 py-2 text-xs text-white">
                            <option value="Staff Collector">Select Staff</option>
                            <option value="Manager">Manager</option>
                            <option value="Field Agent 1">Field Agent 1</option>
                            <option value="Field Agent 2">Field Agent 2</option>
                        </select>
                    </div>
                </div>

                <!-- Customer Search Dropdown Container -->
                <div class="relative">
                    <label class="block text-[10px] font-bold text-purple-400 uppercase mb-1">Search Account Number</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400 text-xs"><i class="fa-solid fa-magnifying-glass"></i></span>
                        <input type="text" id="accountSearchInput" onfocus="showCustomerDropdown()" oninput="filterCustomerDropdown()" placeholder="Search active loans (e.g., VP-1042...)" class="w-full pl-9 pr-4 py-2.5 bg-slate-900/80 border border-slate-700/60 rounded-xl text-white text-xs font-mono focus:border-purple-500 outline-none">
                    </div>

                    <!-- Dropdown List -->
                    <div id="customerDropdownList" class="hidden absolute left-0 right-0 top-full mt-1 bg-[#0d1322] border border-slate-700/80 rounded-xl max-h-48 overflow-y-auto z-50 shadow-2xl divide-y divide-white/5"></div>
                </div>

                <!-- Auto-populated Customer Details -->
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Auto-populated Name</label>
                        <input type="text" id="custName" readonly placeholder="Customer Name" class="w-full bg-slate-950/60 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-300 font-semibold" readonly>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Suggested EMI (₹)</label>
                        <input type="text" id="custEmi" readonly placeholder="0.00" class="w-full bg-slate-950/60 border border-slate-800 rounded-xl px-3 py-2 text-xs text-emerald-400 font-bold font-mono" readonly>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[10px] font-bold text-amber-400 uppercase mb-1">Payment Channel Mode</label>
                        <select id="paymentChannel" class="w-full bg-slate-900/80 border border-slate-700/60 rounded-xl px-3 py-2 text-xs text-white">
                            <option value="Cash">Cash</option>
                            <option value="UPI / Online">UPI / Online</option>
                            <option value="Bank Transfer">Bank Transfer</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-amber-400 uppercase mb-1">Transaction Amount (₹)</label>
                        <input type="number" id="txnAmount" placeholder="0.00" class="w-full bg-slate-900/80 border border-slate-700/60 rounded-xl px-3 py-2 text-xs text-emerald-400 font-bold font-mono">
                    </div>
                </div>

                <div class="flex justify-end gap-3 pt-4 border-t border-white/5">
                    <button onclick="clearForm()" class="px-5 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-semibold">Clear</button>
                    <button onclick="saveTransaction()" class="px-6 py-2 yono-gradient hover:opacity-90 text-white font-bold text-xs rounded-xl shadow-lg flex items-center gap-1.5">
                        <i class="fa-solid fa-circle-check"></i> Authorize & Save Entry
                    </button>
                </div>

            </div>
        </div>
    </main>

    <script>
        let selectedCustomerObj = null;

        // Set default date today
        document.getElementById('txnDate').value = new Date().toISOString().split('T')[0];

        function toggleSidebarLayout() {
            document.getElementById('sidebar').classList.toggle('-translate-x-full');
        }

        // Flexibly fetch customers whether status is 'LOAN APPROVED', 'Approved', or case differences
        function getApprovedCustomers() {
            const customers = JSON.parse(localStorage.getItem('vp_customers')) || [];
            return customers.filter(c => {
                const status = (c.status || '').toString().trim().toUpperCase();
                return status.includes('APPROVED') || status.includes('LOAN APPROVED');
            });
        }

        function showCustomerDropdown() {
            filterCustomerDropdown();
        }

        function filterCustomerDropdown() {
            const approvedList = getApprovedCustomers();
            const inputVal = document.getElementById('accountSearchInput').value.trim().toUpperCase();
            const dropdown = document.getElementById('customerDropdownList');
            dropdown.innerHTML = '';

            const filtered = approvedList.filter(c => {
                const accNo = (c.accountNo || c.accNo || '').toString().toUpperCase();
                const name = (c.name || c.customerName || '').toString().toUpperCase();
                return accNo.includes(inputVal) || name.includes(inputVal);
            });

            if (filtered.length === 0) {
                dropdown.innerHTML = `<div class="p-3 text-slate-500 italic text-xs text-center">No active approved customers found!</div>`;
            } else {
                filtered.forEach(c => {
                    const accNo = c.accountNo || c.accNo || 'VP-UNKNOWN';
                    const name = c.name || c.customerName || 'Unknown';
                    const emi = c.emi || c.emiAmount || 0;

                    const item = document.createElement('div');
                    item.className = "p-2.5 hover:bg-purple-600/20 cursor-pointer transition-colors flex justify-between items-center text-xs";
                    item.innerHTML = `
                        <div>
                            <span class="font-mono font-bold text-purple-400 mr-2">${accNo}</span>
                            <span class="text-white">${name}</span>
                        </div>
                        <span class="text-emerald-400 font-mono text-[11px]">EMI: ₹${parseFloat(emi).toFixed(2)}</span>
                    `;
                    item.onclick = () => selectCustomer(c);
                    dropdown.appendChild(item);
                });
            }
            dropdown.classList.remove('hidden');
        }

        function selectCustomer(c) {
            selectedCustomerObj = c;
            const accNo = c.accountNo || c.accNo || '';
            const name = c.name || c.customerName || '';
            const emi = c.emi || c.emiAmount || 0;

            document.getElementById('accountSearchInput').value = `${accNo} - ${name}`;
            document.getElementById('custName').value = name;
            document.getElementById('custEmi').value = parseFloat(emi).toFixed(2);
            document.getElementById('txnAmount').value = parseFloat(emi).toFixed(2);

            document.getElementById('customerDropdownList').classList.add('hidden');
        }

        // Close dropdown when clicked outside
        document.addEventListener('click', function (e) {
            const dropdown = document.getElementById('customerDropdownList');
            const searchInput = document.getElementById('accountSearchInput');
            if (!dropdown.contains(e.target) && e.target !== searchInput) {
                dropdown.classList.add('hidden');
            }
        });

        function clearForm() {
            selectedCustomerObj = null;
            document.getElementById('accountSearchInput').value = '';
            document.getElementById('custName').value = '';
            document.getElementById('custEmi').value = '';
            document.getElementById('txnAmount').value = '';
            document.getElementById('customerDropdownList').classList.add('hidden');
        }

        function saveTransaction() {
            const date = document.getElementById('txnDate').value;
            const collector = document.getElementById('collectorStaff').value;
            const amount = parseFloat(document.getElementById('txnAmount').value);
            const channel = document.getElementById('paymentChannel').value;

            if (!selectedCustomerObj) {
                alert("Please select a valid customer from the dropdown!");
                return;
            }

            if (!amount || amount <= 0) {
                alert("Please enter a valid payment amount!");
                return;
            }

            const receipts = JSON.parse(localStorage.getItem('vp_receipts')) || [];
            
            // Auto-generate Receipt No
            const receiptNo = "REC-" + Math.floor(100000 + Math.random() * 900000);

            const newReceipt = {
                receiptNo: receiptNo,
                date: date,
                accountNo: selectedCustomerObj.accountNo || selectedCustomerObj.accNo,
                customerName: selectedCustomerObj.name || selectedCustomerObj.customerName,
                amount: amount,
                paymentMode: channel,
                madeBy: collector
            };

            receipts.push(newReceipt);
            localStorage.setItem('vp_receipts', JSON.stringify(receipts));

            alert(`✅ Transaction Saved Successfully!\nReceipt No: ${receiptNo}\nData synced with Passbook and Receipts Hub.`);
            clearForm();
        }
    </script>
</body>
</html>
