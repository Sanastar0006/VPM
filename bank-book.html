<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bank Book | VP MICROFINANCE PRO 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: sans-serif; background: #0b0f19; color: #e2e8f0; }
        .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
    </style>
</head>
<body class="p-6">
    <div class="max-w-7xl mx-auto space-y-6">
        <div class="flex items-center justify-between">
            <h2 class="text-xl font-bold text-white"><i class="fa-solid fa-building-columns text-blue-500"></i> Bank Book Terminal</h2>
            <a href="transaction.html" class="px-4 py-2 bg-purple-600 hover:bg-purple-700 text-white text-xs font-bold rounded-xl">
                <i class="fa-solid fa-arrow-left"></i> Back to Terminal
            </a>
        </div>

        <div class="glass-card rounded-2xl p-4 overflow-x-auto">
            <table class="w-full text-left text-xs">
                <thead class="text-slate-400 border-b border-white/10 uppercase">
                    <tr>
                        <th class="p-3">Date</th>
                        <th class="p-3">Voucher No</th>
                        <th class="p-3">Particulars</th>
                        <th class="p-3">Made By</th>
                        <th class="p-3">Type</th>
                        <th class="p-3">Amount</th>
                        <th class="p-3 text-center">Actions</th>
                    </tr>
                </thead>
                <tbody id="bankTableBody" class="divide-y divide-white/5"></tbody>
            </table>
            
            <div class="mt-4 pt-4 border-t border-white/10 flex justify-between text-xs font-bold">
                <div>Total Credit: <span id="totalCredit" class="text-emerald-400">₹0.00</span></div>
                <div>Total Debit: <span id="totalDebit" class="text-rose-400">₹0.00</span></div>
                <div>Closing Bank Balance: <span id="closingBalance" class="text-blue-400">₹0.00</span></div>
            </div>
            
            <button onclick="window.print()" class="mt-4 px-4 py-2 bg-blue-600 text-white text-xs font-bold rounded-xl">
                <i class="fa-solid fa-print"></i> Print Bank Book Statement
            </button>
        </div>
    </div>

    <!-- Modal for Editing Bank Entry -->
    <div id="editBankModal" class="fixed inset-0 bg-black/80 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-[#0f1524] border border-white/10 p-6 rounded-2xl max-w-md w-full space-y-4">
            <h3 class="text-sm font-bold text-white border-b border-white/10 pb-2"><i class="fa-solid fa-pen-to-square text-blue-400"></i> Edit Bank Entry</h3>
            <input type="hidden" id="editBankIndex">
            
            <div>
                <label class="block text-[10px] text-slate-400 uppercase mb-1">Date</label>
                <input type="date" id="editBankDate" class="w-full bg-white/5 border border-slate-700 p-2 rounded text-xs text-white">
            </div>
            <div>
                <label class="block text-[10px] text-slate-400 uppercase mb-1">Voucher No</label>
                <input type="text" id="editBankVoucherNo" class="w-full bg-white/5 border border-slate-700 p-2 rounded text-xs text-white">
            </div>
            <div>
                <label class="block text-[10px] text-slate-400 uppercase mb-1">Particulars</label>
                <input type="text" id="editBankParticular" class="w-full bg-white/5 border border-slate-700 p-2 rounded text-xs text-white">
            </div>
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-[10px] text-slate-400 uppercase mb-1">Made By</label>
                    <select id="editBankMadeBy" class="w-full bg-[#0f1524] border border-slate-700 p-2 rounded text-xs text-white">
                        <option value="Admin / Branch Mgr">Admin / Branch Mgr</option>
                        <option value="Field Officer 1">Field Officer 1</option>
                        <option value="Field Officer 2">Field Officer 2</option>
                        <option value="Cashier">Cashier</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[10px] text-slate-400 uppercase mb-1">Type</label>
                    <select id="editBankType" class="w-full bg-[#0f1524] border border-slate-700 p-2 rounded text-xs text-white">
                        <option value="CREDIT">CREDIT</option>
                        <option value="DEBIT">DEBIT</option>
                    </select>
                </div>
            </div>
            <div>
                <label class="block text-[10px] text-slate-400 uppercase mb-1">Amount (₹)</label>
                <input type="number" step="0.01" id="editBankAmount" class="w-full bg-white/5 border border-slate-700 p-2 rounded text-xs text-white font-mono">
            </div>

            <div class="flex justify-end gap-2 pt-2 border-t border-white/10">
                <button onclick="closeEditBankModal()" class="px-3 py-1.5 bg-white/10 text-slate-300 text-xs rounded-xl">Cancel</button>
                <button onclick="saveBankEdit()" class="px-4 py-1.5 bg-blue-600 text-white text-xs font-bold rounded-xl">Save Changes</button>
            </div>
        </div>
    </div>

    <script>
        function loadBankBook() {
            const list = JSON.parse(localStorage.getItem('vp_bank_book')) || [];
            const tbody = document.getElementById('bankTableBody');
            tbody.innerHTML = '';

            let credit = 0;
            let debit = 0;

            if (list.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="p-4 text-center text-slate-500 italic">No bank entries found!</td></tr>`;
            } else {
                list.forEach((item, index) => {
                    let amt = parseFloat(item.amount) || 0;
                    if (item.type === 'DEBIT') debit += amt;
                    else credit += amt;

                    tbody.innerHTML += `
                        <tr>
                            <td class="p-3">${item.date}</td>
                            <td class="p-3 font-mono text-blue-400">${item.voucherNo || 'N/A'}</td>
                            <td class="p-3">${item.particular || '-'}</td>
                            <td class="p-3">${item.madeBy || '-'}</td>
                            <td class="p-3 font-bold ${item.type === 'DEBIT' ? 'text-rose-400' : 'text-emerald-400'}">${item.type || 'CREDIT'}</td>
                            <td class="p-3 font-bold">₹${amt.toFixed(2)}</td>
                            <td class="p-3 text-center space-x-2">
                                <button onclick="openEditBankModal(${index})" class="px-2 py-1 bg-amber-600/20 text-amber-400 hover:bg-amber-600 hover:text-white rounded text-[11px] font-medium transition-all">
                                    <i class="fa-solid fa-pen"></i> Edit
                                </button>
                                <button onclick="deleteBankEntry(${index})" class="px-2 py-1 bg-rose-600/20 text-rose-400 hover:bg-rose-600 hover:text-white rounded text-[11px] font-medium transition-all">
                                    <i class="fa-solid fa-trash"></i> Delete
                                </button>
                            </td>
                        </tr>
                    `;
                });
            }

            let closing = credit - debit;
            document.getElementById('totalCredit').innerText = `₹${credit.toFixed(2)}`;
            document.getElementById('totalDebit').innerText = `₹${debit.toFixed(2)}`;
            document.getElementById('closingBalance').innerText = `₹${closing.toFixed(2)}`;
        }

        function deleteBankEntry(index) {
            if (confirm("Are you sure you want to delete this bank entry?")) {
                let list = JSON.parse(localStorage.getItem('vp_bank_book')) || [];
                list.splice(index, 1);
                localStorage.setItem('vp_bank_book', JSON.stringify(list));
                loadBankBook();
            }
        }

        function openEditBankModal(index) {
            let list = JSON.parse(localStorage.getItem('vp_bank_book')) || [];
            let item = list[index];
            if (!item) return;

            document.getElementById('editBankIndex').value = index;
            document.getElementById('editBankDate').value = item.date || '';
            document.getElementById('editBankVoucherNo').value = item.voucherNo || '';
            document.getElementById('editBankParticular').value = item.particular || '';
            document.getElementById('editBankMadeBy').value = item.madeBy || 'Admin / Branch Mgr';
            document.getElementById('editBankType').value = item.type || 'CREDIT';
            document.getElementById('editBankAmount').value = item.amount || 0;

            document.getElementById('editBankModal').classList.remove('hidden');
        }

        function closeEditBankModal() {
            document.getElementById('editBankModal').classList.add('hidden');
        }

        function saveBankEdit() {
            let index = document.getElementById('editBankIndex').value;
            let list = JSON.parse(localStorage.getItem('vp_bank_book')) || [];

            if (index !== "" && list[index]) {
                list[index].date = document.getElementById('editBankDate').value;
                list[index].voucherNo = document.getElementById('editBankVoucherNo').value;
                list[index].particular = document.getElementById('editBankParticular').value;
                list[index].madeBy = document.getElementById('editBankMadeBy').value;
                list[index].type = document.getElementById('editBankType').value;
                list[index].amount = parseFloat(document.getElementById('editBankAmount').value) || 0;

                localStorage.setItem('vp_bank_book', JSON.stringify(list));
                closeEditBankModal();
                loadBankBook();
            }
        }

        window.onload = loadBankBook;
    </script>
</body>
</html>
